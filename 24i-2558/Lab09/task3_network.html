<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Task 3 - Flight Route Network</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 20px; }
  .link { stroke: #999; stroke-opacity: 0.6; }
  .node circle { stroke: #fff; stroke-width: 1.2px; cursor: grab; }
  .node text { font-size: 11px; pointer-events: none; }
  .faded { opacity: 0.1; }
</style>
</head>
<body>
<h2>Flight Route Network (Pakistani Cities)</h2>
<svg id="chart" width="900" height="600"></svg>

<script>
const width = 900, height = 600;
const svg = d3.select("#chart");

d3.csv("dataset/flights.csv", d3.autoType).then(edges => {
  // ---- Build the NODE LIST from the EDGE LIST ----
  // The csv is only source/target/flights rows. A force simulation needs an
  // explicit node array, so collect every distinct city name via a Set.
  const names = new Set();
  edges.forEach(e => { names.add(e.source); names.add(e.target); });

  // degree = number of distinct routes touching a city -> drives node radius
  const degree = new Map(Array.from(names, n => [n, 0]));
  edges.forEach(e => { degree.set(e.source, degree.get(e.source)+1); degree.set(e.target, degree.get(e.target)+1); });

  const nodes = Array.from(names, name => ({ id: name, degree: degree.get(name) }));
  const links = edges.map(e => ({ source: e.source, target: e.target, flights: e.flights }));

  const rScale = d3.scaleSqrt().domain([0, d3.max(nodes, d => d.degree)]).range([8, 28]);
  const widthScale = d3.scaleLinear().domain([0, d3.max(links, d => d.flights)]).range([1, 10]);

  // forceLink ties connected nodes together; forceManyBody repels ALL nodes
  // from each other (negative strength), which is what spreads the graph out
  // instead of everything collapsing onto one point.
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(120))
    .force("charge", d3.forceManyBody().strength(-350))
    .force("center", d3.forceCenter(width/2, height/2))
    .force("collide", d3.forceCollide(d => rScale(d.degree) + 6));

  const link = svg.append("g").selectAll("line")
    .data(links).join("line")
    .attr("class", "link")
    .attr("stroke-width", d => widthScale(d.flights));

  const node = svg.append("g").selectAll("g.node")
    .data(nodes).join("g")
    .attr("class", "node")
    .call(drag(simulation));

  node.append("circle").attr("r", d => rScale(d.degree)).attr("fill", "#2a6f97");
  node.append("text").attr("text-anchor", "middle").attr("dy", d => -rScale(d.degree) - 6).text(d => d.id);

  node.on("mouseover", (event, d) => {
      const connected = new Set([d.id]);
      links.forEach(l => {
        if (l.source.id === d.id || l.target.id === d.id) { connected.add(l.source.id); connected.add(l.target.id); }
      });
      node.classed("faded", n => !connected.has(n.id));
      link.classed("faded", l => l.source.id !== d.id && l.target.id !== d.id);
    })
    .on("mouseout", () => { node.classed("faded", false); link.classed("faded", false); });

  simulation.on("tick", () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  function drag(sim) {
    function dragstarted(event, d) { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
    function dragended(event, d) { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }
    return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
  }
});
</script>
</body>
</html>
